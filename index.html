<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reife Frauen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        #bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2;
        }

        .content-box {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            text-align: center;
            padding: 20px;
        }

        .timer-text {
            color: #ffcc00;
            font-size: 3rem;
            font-weight: 700;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
            letter-spacing: 2px;
        }

        .age-text {
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
            letter-spacing: 0.5px;
        }

        .btn-ver-video {
            display: inline-block;
            padding: 16px 36px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffffff;
            background-color: #e50914;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
        }

        .btn-ver-video:hover {
            background-color: #f40612;
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(229, 9, 20, 0.6);
        }

        .btn-ver-video:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- Video-Element -->
        <video id="bg-video" autoplay muted loop playsinline>
            Ihr Browser unterstützt die Videowiedergabe nicht.
        </video>

        <!-- Verdunkelungs-Overlay -->
        <div class="overlay"></div>

        <!-- Zentraler Container -->
        <div class="content-box">
            <div id="countdown" class="timer-text">04:00</div>
            <h1 class="age-text">Bist du über 45 Jahre alt?</h1>
            <a href="https://connectorlink.online/a/Nk54gTj1LoHRQQR" class="btn-ver-video">VIDEO ANSEHEN</a>
        </div>
    </div>

    <script>
        // Lista der bereitgestellten Video-Links
        const videos = [
            "https://i.imgur.com/TOQHj6e.mp4",
            "https://i.imgur.com/Tq2JZoO.mp4",
            "https://i.imgur.com/dC8bukU.mp4"
        ];

        // Zufälligen Index zwischen 0 und 2 auswählen
        const randomIndex = Math.floor(Math.random() * videos.length);

        // Zufällige Quelle dem Video-Element zuweisen
        const videoElement = document.getElementById("bg-video");
        videoElement.src = videos[randomIndex];

        // Laden und Abspielen erzwingen
        videoElement.load();
        videoElement.play().catch(error => {
            console.log("Die automatische Wiedergabe wurde vom Browser verhindert:", error);
        });

        // Lógica del Temporizador con ejecución inmediata
        function startTimer(duration, display) {
            let timer = duration, minutes, seconds;
            
            function updateTimer() {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);

                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                display.textContent = minutes + ":" + seconds;

                if (--timer < 0) {
                    timer = duration; // Reinicia el temporizador al llegar a 0
                }
            }

            updateTimer(); // Ejecuta inmediatamente para evitar el retraso de 1 segundo
            setInterval(updateTimer, 1000);
        }

        window.onload = function () {
            let fourMinutes = 60 * 4,
                display = document.querySelector('#countdown');
            startTimer(fourMinutes, display);
        };
    </script>

</body>
</html>
